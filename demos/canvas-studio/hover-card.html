<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    />
    <link rel="stylesheet" href="./src/style.css"/>
    <link rel="stylesheet" href="./src/normalize.css"/>
    <title>Hover Card — Canvas Studio</title>
    <link rel="stylesheet" href="./src/nav.css"/>
    <link rel="stylesheet" href="./portfolio/badge.css"/>
</head>
<body data-pf-badge-text="Portfolio build" data-pf-badge-back="../../">
<canvas id="myCanvas"></canvas>
<img src="./floating.png" alt="" class="floating"/>
<div class="button">
    <div class="line"></div>
    <div class="outer-circle">
        <svg class="ring" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="48"/>
        </svg>
        <div class="circle">
            <span class="number">1</span>
        </div>
    </div>
</div>


<div class="image__wrapper">
    <img src="./artwork.png" alt="Abstract artwork card" class="image"/>
</div>


<div id="app"></div>
<script type="module" src="./src/main.js"></script>
<script type="module" src="./src/old-homeworks/particles.js"></script>
<script type="module" src="./src/nav.js"></script>
<script type="module" src="./src/fit.js"></script>
<script type="module" src="./portfolio/badge.js"></script>
</body>
</html>
