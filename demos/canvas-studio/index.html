<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>

            name="viewport"

    />
    <link rel="stylesheet" href="./src/fabric/t-shirt-fabric.css"/>

<body data-pf-badge-text="Portfolio build" data-pf-badge-back="../../">
<canvas id="myCanvas"></canvas>
<input type="file" id="imageUpload" accept="image/*"/>

<input type="text" id="textInput"/>

<button id="triangleButton">Add triangle</button>
<button id="rectangleButton">Add rectangle</button>
<button id="circleButton">Add circle</button>

<button id="downloadButton">Download</button>


<script type="module" src="./src/fabric/t-shirt-fabric.js"></script>
<script type="module" src="./src/nav.js"></script>
