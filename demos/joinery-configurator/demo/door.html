<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Joinery Configurator — door reference</title>
  <style>
    body { margin: 0; font: 14px/1.5 system-ui, sans-serif; }
    #viewer { width: 100%; height: 100vh; background: #e3e3e3; }
  </style>
</head>

<body>
  <!-- The configurator creates its own canvas inside this element. -->
  <div id="viewer"></div>

  <!-- Three.js is bundled into the configurator; this importmap exists only so
       the unbundled source runs during development. The shipped bundle needs no
       importmap at all. -->
  <script type="importmap">{
    "imports": {
      "three": "../js/libs/three.0.183.2/build/three.module.min.js",
      "three/addons/": "../js/libs/three.0.183.2/examples/jsm/"
    }
  }</script>

  <script type="module">
    import {
      mount, applyConfiguration, getConfiguration, whenSettled, PRODUCT_TYPE,
    } from '../js/integration/entry-door.js';

    const CONFIG = {
      schemaVersion: '1.0',
      locale: 'en',
      dimensions: { widthMm: 1000, heightMm: 2100 },
      profile: { material: 'alum', series: '70', offset: 'zonder' },
      colors: { exteriorHex: '#383E42', interiorHex: '#FFFFFF' },
      presentation: { view: 'inside' },
      options: {
        designType: '2', glassType: 'clear', hasWindowFrame: false, openSide: 'left',
        handleInside: 1, handleOutside: 2, handleColor: 'hc_chrome', hingeType: 1,
        hasPost: false, hasVent: false,
      },
    };

    await mount(document.getElementById('viewer'), {
      configuration: CONFIG,
      onError: result => console.error('JOINERY_CONFIG errors', result.errors),
    });

    // The page has no controls — it is driven from devtools. `send` applies a
    // payload and resolves with the validation result once the scene settles,
    // so the console shows warnings instead of them scrolling past unseen.
    const send = async (config) => {
      const result = applyConfiguration(config);
      await whenSettled();
      return result;
    };

    window.__api = {
      mount, applyConfiguration, getConfiguration, whenSettled, send,
      PRODUCT_TYPE, CONFIG,
    };

    console.info(`JOINERY_CONFIG mounted (${PRODUCT_TYPE}) — use __api.send(__api.CONFIG)`);
  </script>
</body>

</html>
